name: Publish to npm

# Publishes the package to npmjs.org.
# Triggers:
#   1. release published — the normal path from v0.1.2 on (create a release
#      with a new tag, the workflow publishes that tag).
#   2. workflow_dispatch — manual "Run workflow" button, used for the first
#      0.1.1 publish because its tag predates this file.
# Requires the NPM_TOKEN repository secret (classic Automation token from
# npmjs.com). Without it the run fails fast and nothing is published.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
